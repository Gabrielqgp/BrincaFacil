spring:
  application:
    name: brincafacil
  web:
    error:
      whitelabel:
        enabled: false
      include-message: always
      include-binding-errors: always
      include-stacktrace: never
      include-exception: true
  datasource:
    url: jdbc:h2:file:./data/locacao;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

  config:
    import: "classpath:security.yaml"

server:
  servlet:
    context-path: /api
springdoc:
  swagger-ui:
    use-root-path: true

logging:
  file:
    path: ./logs
